<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPS Camera - Free Tool</title>
<style>
body{font-family:Arial;text-align:center;padding:10px}
video{width:100%;max-width:500px;border-radius:10px;background:#000}
button{padding:12px 20px;margin:5px;font-size:16px;border-radius:8px;border:none;background:#007bff;color:#fff}
#photoBox img{width:100%;max-width:500px;margin-top:10px}
iframe{width:100%;max-width:500px;height:250px;border:0;border-radius:10px;margin-top:10px}
.mapBtn{background:#28a745;display:inline-block;padding:12px 20px;color:#fff;text-decoration:none;border-radius:8px;margin-top:5px}
</style>
</head>
<body>
<h2>GPS Camera - Free Tool</h2>
<p>Photo par Location, Date aur Time lagao</p>
<video id="video" autoplay playsinline></video>
<div id="info">Location loading... Thora wait karein...</div>
<br>
<button onclick="switchCamera()">Camera Badlo - Front / Back</button>
<br>
<button onclick="takePhoto()">Photo Lo</button>
<div id="photoBox"><p>Neeche aapki photo aayegi, phir Download dabayein</p></div>
<div id="mapBox"></div>
<canvas id="canvas" style="display:none"></canvas>
<a id="download" style="display:none" download="gps-photo.jpg">Download Photo</a>
<script>
let lat="---", lon="---";
let currentStream=null;
let facingMode="environment";
if(navigator.geolocation){
  navigator.geolocation.getCurrentPosition(p=>{
    lat=p.coords.latitude.toFixed(6);
    lon=p.coords.longitude.toFixed(6);
    document.getElementById('info').innerHTML="Lat: "+lat+"<br>Long: "+lon;
    showMap();
  });
}
function showMap(){
  document.getElementById('mapBox').innerHTML='<h3>Location Map</h3><iframe src="https://maps.google.com/maps?q='+lat+','+lon+'&z=15&output=embed"></iframe><br><a class="mapBtn" target="_blank" href="https://maps.google.com/?q='+lat+','+lon+'">Google Maps Mein Kholein</a>';
}
async function startCamera(){
  if(currentStream){ currentStream.getTracks().forEach(t=>t.stop()); }
  try{
    let s=await navigator.mediaDevices.getUserMedia({video:{facingMode:facingMode}});
    currentStream=s;
    document.getElementById('video').srcObject=s;
  }catch(e){ alert("Camera nahi khula: "+e); }
}
function switchCamera(){
  if(facingMode=="environment"){ facingMode="user"; }
  else{ facingMode="environment"; }
  startCamera();
}
function takePhoto(){
  let v=document.getElementById('video');
  let c=document.getElementById('canvas');
  c.width=v.videoWidth; c.height=v.videoHeight;
  let ctx=c.getContext('2d');
  ctx.drawImage(v,0,0);
  ctx.fillStyle="rgba(0,0,0,0.75)"; ctx.fillRect(0,c.height-120,c.width,120);
  ctx.fillStyle="#fff"; ctx.font="bold 20px Arial";
  ctx.fillText("GPS Camera - "+new Date().toLocaleString(),10,c.height-90);
  ctx.fillText("Lat "+lat+"  Long "+lon,10,c.height-60);
  ctx.fillText("Pakistan - Free GPS Camera Tool",10,c.height-30);
  let img=document.createElement('img');
  img.src=c.toDataURL('image/jpeg');
  document.getElementById('photoBox').innerHTML="";
  document.getElementById('photoBox').appendChild(img);
  let d=document.getElementById('download');
  d.href=c.toDataURL('image/jpeg');
  d.style.display="block";
  d.innerText="Download Photo";
  showMap();
}
startCamera();
</script>
</body>
</html>
